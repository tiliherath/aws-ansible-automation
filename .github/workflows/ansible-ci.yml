name: Ansible CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/playbooks/health_check.yml

      - name: Ansible syntax check
        run: |
          ANSIBLE_CONFIG=$PWD/ansible.cfg \
          ansible-playbook --syntax-check ansible/playbooks/health_check.yml

      - name: Validate project structure
        run: |
          test -f ansible/playbooks/health_check.yml
          test -f ansible/playbooks/templates/health_report.json.j2
          test -f ansible/playbooks/templates/health_report.html.j2
          test -d ansible/inventory
          test -d ansible/roles
          test -d reports/json
          test -d reports/html
          echo "Project structure validation passed"