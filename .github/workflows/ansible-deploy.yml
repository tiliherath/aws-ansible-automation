name: Ansible Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Ansible Automation
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible
          python -m pip install boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify GitHub workspace
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          ls -la ansible/playbooks
          ls -la reports || true

      - name: Run Ansible health check
        run: |
          ANSIBLE_CONFIG=$PWD/ansible.cfg \
          ansible-playbook ansible/playbooks/health_check.yml

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-health-reports
          path: reports/
          
      - name: Send health reports by email
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          python scripts/send_health_report.py
